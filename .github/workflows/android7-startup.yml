name: Android 7 TV startup check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK components
        run: |
          sdk_dir="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/android-command-line-tools.zip"
          mkdir -p "$sdk_dir/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip --output "$tools_zip"
          echo "d313adb7aedccf6cf0cfca51ec180f0059f5f8f8  $tools_zip" | sha1sum --check
          unzip -q "$tools_zip" -d "$sdk_dir/cmdline-tools"
          mv "$sdk_dir/cmdline-tools/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          sdk_manager="$sdk_dir/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdk_manager" --sdk_root="$sdk_dir" --licenses >/dev/null
          set -o pipefail
          "$sdk_manager" --sdk_root="$sdk_dir" 'platforms;android-35' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Download published 2.0.0 APK
        run: |
          mkdir -p startup-results
          curl --fail --location --retry 3 https://github.com/saeedt20/CouchZap/releases/download/v2.0.0/CouchZap-2.0.0.apk --output startup-results/baseline.apk
          echo '3358825bf3efef6ef14c64f7eb856ae0a3baa9b0894e702724fdfae7d66013ba  startup-results/baseline.apk' | sha256sum --check
      - name: Start published APK on Android 7 TV
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 24
          target: android-tv
          arch: x86
          ram-size: 1536M
          script: |
            adb install startup-results/baseline.apk
            adb logcat -c
            adb shell am start -W -n com.couchzap.iptv/.MainActivity
            sleep 8
            adb logcat -d > startup-results/logcat.txt
            adb shell dumpsys activity activities > startup-results/activities.txt
            adb logcat -d -b crash > startup-results/crash.txt
            cat startup-results/crash.txt
            adb shell pidof com.couchzap.iptv
      - name: Preserve startup logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android7-startup-results
          path: |
            startup-results/logcat.txt
            startup-results/activities.txt
            startup-results/crash.txt
          retention-days: 7
