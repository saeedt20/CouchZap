name: Android checks and release

on:
  push:
    branches: [main, codex/couchzap-2.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install SDK components
        run: |
          sdk_dir="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/android-command-line-tools.zip"
          mkdir -p "$sdk_dir/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip --output "$tools_zip"
          echo "d313adb7aedccf6cf0cfca51ec180f0059f5f8f8  $tools_zip" | sha1sum --check
          unzip -q "$tools_zip" -d "$sdk_dir/cmdline-tools"
          mv "$sdk_dir/cmdline-tools/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          sdk_manager="$sdk_dir/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdk_manager" --sdk_root="$sdk_dir" --licenses >/dev/null
          set -o pipefail
          "$sdk_manager" --sdk_root="$sdk_dir" 'platforms;android-35' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - name: Test, lint and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease

      - name: Upload unsigned release for signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: couchzap-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  reviewed_release_android7:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/android7-probe.yml

  release:
    needs: [checks, reviewed_release_android7]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Publish the reviewed signed APK once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v2.0.2 >/dev/null 2>&1; then
            echo 'Release v2.0.2 already exists; leaving its assets unchanged.'
          else
            startup_result=$(gh api "repos/$GH_REPO/actions/runs/38533394609" --jq '.conclusion')
            test "$startup_result" = success
            build_run=$(python3 -c "import json; print(json.load(open('distribution/release-recipe.json'))['build_run_id'])")
            gh run download "$build_run" --name couchzap-2.0.2-unsigned --dir "$RUNNER_TEMP/reviewed-build"
            python3 scripts/assemble-reviewed-release.py \
              distribution/release-recipe.json \
              "$RUNNER_TEMP/reviewed-build/app-release-unsigned.apk" \
              distribution/CouchZap-2.0.2.apk
            (cd distribution && sha256sum --check CouchZap-2.0.2.apk.sha256)
            gh release create v2.0.2 \
              distribution/CouchZap-2.0.2.apk \
              distribution/CouchZap-2.0.2.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title 'CouchZap 2.0.2 — Public channels, updates and diagnostics' \
              --notes-file docs/releases/v2.0.2.md
          fi
