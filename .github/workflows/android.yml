name: Android checks and release

on:
  push:
    branches: [main, codex/couchzap-2.0, codex/couchzap-2.1, codex/settings-ui-fixes, codex/persian-ui-2.1.3, codex/localization-search-2.1.4]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      artifact_name: ${{ steps.release_metadata.outputs.artifact_name }}
      reviewed_recipe_matches: ${{ steps.release_metadata.outputs.reviewed_recipe_matches }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Read release metadata
        id: release_metadata
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          version = re.search(r'versionName = "([0-9]+\.[0-9]+\.[0-9]+)"', Path('app/build.gradle.kts').read_text()).group(1)
          recipe = json.loads(Path('distribution/release-recipe.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nartifact_name=couchzap-{version}-unsigned\n')
              output.write(f'reviewed_recipe_matches={str(recipe["version"] == version).lower()}\n')
          PYTHON
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21' # Robolectric API 36 regression coverage requires Java 21.
          cache: gradle
      - name: Install SDK components
        run: |
          sdk_dir="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/android-command-line-tools.zip"
          mkdir -p "$sdk_dir/cmdline-tools"
          for attempt in 1 2 3; do
            rm -f "$tools_zip"
            if curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip --output "$tools_zip" &&
              echo "d313adb7aedccf6cf0cfca51ec180f0059f5f8f8  $tools_zip" | sha1sum --check; then
              break
            fi
          done
          echo "d313adb7aedccf6cf0cfca51ec180f0059f5f8f8  $tools_zip" | sha1sum --check
          unzip -q "$tools_zip" -d "$sdk_dir/cmdline-tools"
          mv "$sdk_dir/cmdline-tools/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          sdk_manager="$sdk_dir/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdk_manager" --sdk_root="$sdk_dir" --licenses >/dev/null
          set -o pipefail
          "$sdk_manager" --sdk_root="$sdk_dir" 'platforms;android-35' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - name: Test, lint and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease

      - name: Upload unsigned release for signing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release_metadata.outputs.artifact_name }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  reviewed_release_android7:
    needs: checks
    if: github.ref == 'refs/heads/main' && needs.checks.outputs.reviewed_recipe_matches == 'true'
    uses: ./.github/workflows/android7-probe.yml
    permissions:
      contents: read
      actions: read

  release:
    needs: [checks, reviewed_release_android7]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.checks.outputs.reviewed_recipe_matches == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Publish the reviewed signed APK once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.checks.outputs.version }}
          CURRENT_ARTIFACT: ${{ needs.checks.outputs.artifact_name }}
        run: |
          release_state=$(gh release view "v$RELEASE_VERSION" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$release_state" = false ]; then
            echo "Release v$RELEASE_VERSION already exists; leaving its assets unchanged."
            exit 0
          fi
          build_run=$(python3 -c "import json; print(json.load(open('distribution/release-recipe.json'))['build_run_id'])")
          artifact_name=$(python3 -c "import json; print(json.load(open('distribution/release-recipe.json'))['artifact_name'])")
          source_commit=$(python3 -c "import json; print(json.load(open('distribution/release-recipe.json'))['source_commit'])")
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq '.conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq '.head_sha')" = "$source_commit"
          gh run download "$build_run" --name "$artifact_name" --dir "$RUNNER_TEMP/reviewed-build"
          python3 scripts/assemble-reviewed-release.py \
            distribution/release-recipe.json \
            "$RUNNER_TEMP/reviewed-build/app-release-unsigned.apk" \
            "distribution/CouchZap-$RELEASE_VERSION.apk"
          gh run download "$GITHUB_RUN_ID" --name "$CURRENT_ARTIFACT" --dir "$RUNNER_TEMP/current-build"
          python3 scripts/verify-reviewed-release.py "$RUNNER_TEMP/current-build/app-release-unsigned.apk" "distribution/CouchZap-$RELEASE_VERSION.apk"
          (cd distribution && sha256sum --check "CouchZap-$RELEASE_VERSION.apk.sha256")
          if [ "$release_state" = true ]; then
            gh release upload "v$RELEASE_VERSION" \
              "distribution/CouchZap-$RELEASE_VERSION.apk" \
              "distribution/CouchZap-$RELEASE_VERSION.apk.sha256" --clobber
            gh release edit "v$RELEASE_VERSION" --draft=false \
              --target "$GITHUB_SHA" --title "CouchZap $RELEASE_VERSION" \
              --notes-file "docs/releases/v$RELEASE_VERSION.md"
          else
            gh release create "v$RELEASE_VERSION" \
              "distribution/CouchZap-$RELEASE_VERSION.apk" \
              "distribution/CouchZap-$RELEASE_VERSION.apk.sha256" \
              --target "$GITHUB_SHA" \
              --title "CouchZap $RELEASE_VERSION" \
              --notes-file "docs/releases/v$RELEASE_VERSION.md"
          fi
