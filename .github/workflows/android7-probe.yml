name: Signed Android 7 public flow check

on:
  push:
    branches: [codex/android7-network]
    paths: [.github/workflows/android7-probe.yml, scripts/android7-release-check.sh]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK components
        run: |
          sdk_dir="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/android-command-line-tools.zip"
          mkdir -p "$sdk_dir/cmdline-tools"
          for attempt in 1 2 3; do
            rm -f "$tools_zip"
            if curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip --output "$tools_zip" &&
              echo "d313adb7aedccf6cf0cfca51ec180f0059f5f8f8  $tools_zip" | sha1sum --check; then
              break
            fi
          done
          echo "d313adb7aedccf6cf0cfca51ec180f0059f5f8f8  $tools_zip" | sha1sum --check
          unzip -q "$tools_zip" -d "$sdk_dir/cmdline-tools"
          mv "$sdk_dir/cmdline-tools/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          sdk_manager="$sdk_dir/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdk_manager" --sdk_root="$sdk_dir" --licenses >/dev/null
          set -o pipefail
          "$sdk_manager" --sdk_root="$sdk_dir" 'platforms;android-35' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - name: Reconstruct and verify the exact reviewed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p startup-results
          build_run=$(python3 -c "import json; print(json.load(open('distribution/release-recipe.json'))['build_run_id'])")
          artifact_name=$(python3 -c "import json; print(json.load(open('distribution/release-recipe.json'))['artifact_name'])")
          source_commit=$(python3 -c "import json; print(json.load(open('distribution/release-recipe.json'))['source_commit'])")
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq '.conclusion')" = success
          test "$(gh api "repos/$GH_REPO/actions/runs/$build_run" --jq '.head_sha')" = "$source_commit"
          gh run download "$build_run" --name "$artifact_name" --dir startup-results
          python3 scripts/assemble-reviewed-release.py distribution/release-recipe.json startup-results/app-release-unsigned.apk startup-results/candidate.apk
          python3 scripts/verify-reviewed-release.py startup-results/app-release-unsigned.apk startup-results/candidate.apk
      - name: Verify the reviewed APK and enable emulator acceleration
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose startup-results/candidate.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 startup-results/candidate.apk
          sudo chmod 666 /dev/kvm
      - name: Verify the exact signed release APK
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 24
          target: android-tv
          arch: x86
          ram-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1280x720
          script: bash scripts/android7-release-check.sh
      - name: Preserve startup reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android7-signed-public-flow-reports
          path: |
            startup-results/logcat.txt
            startup-results/crash.txt
            startup-results/*-ui.xml
            startup-results/catalog-focus.json
          retention-days: 7
