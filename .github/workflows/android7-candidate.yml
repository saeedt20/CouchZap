name: Android 7 compatibility candidate

on:
  push:
    branches: [codex/android7-startup]
    paths: [app/**, gradle/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install SDK components
        run: |
          sdk_dir="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/android-command-line-tools.zip"
          mkdir -p "$sdk_dir/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip --output "$tools_zip"
          echo "d313adb7aedccf6cf0cfca51ec180f0059f5f8f8  $tools_zip" | sha1sum --check
          unzip -q "$tools_zip" -d "$sdk_dir/cmdline-tools"
          mv "$sdk_dir/cmdline-tools/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          sdk_manager="$sdk_dir/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdk_manager" --sdk_root="$sdk_dir" --licenses >/dev/null
          set -o pipefail
          "$sdk_manager" --sdk_root="$sdk_dir" 'platforms;android-35' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - name: Check and build optimized release
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: couchzap-2.0.1-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  startup:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK components
        run: |
          sdk_dir="$RUNNER_TEMP/android-sdk"
          tools_zip="$RUNNER_TEMP/android-command-line-tools.zip"
          mkdir -p "$sdk_dir/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip --output "$tools_zip"
          echo "d313adb7aedccf6cf0cfca51ec180f0059f5f8f8  $tools_zip" | sha1sum --check
          unzip -q "$tools_zip" -d "$sdk_dir/cmdline-tools"
          mv "$sdk_dir/cmdline-tools/cmdline-tools" "$sdk_dir/cmdline-tools/latest"
          sdk_manager="$sdk_dir/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdk_manager" --sdk_root="$sdk_dir" --licenses >/dev/null
          set -o pipefail
          "$sdk_manager" --sdk_root="$sdk_dir" 'platforms;android-35' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_dir" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: couchzap-2.0.1-unsigned
          path: startup-results
      - name: Sign only for the clean emulator installation
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.p12" -storetype PKCS12 -alias smoke -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Emulator test' -storepass android -keypass android
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/smoke.p12" --ks-pass pass:android --key-pass pass:android --out startup-results/candidate.apk startup-results/app-release-unsigned.apk
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Cold start and reopen on Android TV 7
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 24
          target: android-tv
          arch: x86
          ram-size: 2048M
          emulator-boot-timeout: 300
          script: |
            adb install startup-results/candidate.apk
            adb logcat -c
            adb shell am start -W -n com.couchzap.iptv/.MainActivity
            sleep 5
            adb shell pidof com.couchzap.iptv
            adb shell am force-stop com.couchzap.iptv
            adb shell am start -W -n com.couchzap.iptv/.MainActivity
            sleep 5
            adb logcat -d > startup-results/logcat.txt
            adb logcat -d -b crash > startup-results/crash.txt
            cat startup-results/crash.txt
            adb shell pidof com.couchzap.iptv
      - name: Preserve startup logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android7-candidate-startup
          path: |
            startup-results/logcat.txt
            startup-results/crash.txt
          retention-days: 7
